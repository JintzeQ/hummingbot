# Fractions, not percentage points. Preview mode never submits/cancels orders
# or changes leverage/position mode. Copy to conf/scripts before starting.
script_file_name: avellaneda_perpetual.py
connector: gate_io_perpetual
trading_pair: BTC-USDT
dry_run: true
leverage: 1
capital_budget_quote: "50"
order_amount_quote: "10"
max_position_quote: "40"
available_balance_reserve: "5"
risk_factor: 1.0
# Fixed mode keeps risk_factor. Adaptive preview collects a continuous 15-minute
# calibration; live adaptive mode requires exporting a matching calibration.
gamma_mode: adaptive
gamma_calibration: null
calibration_seconds: 900.0
calibration_target_ticks: 2.0
calibration_max_age_seconds: 86400.0
gamma_update_seconds: 5.0
gamma_smoothing: 0.2
gamma_max_step: 0.1
gamma_min_ratio: 0.5
gamma_max_ratio: 3.0
gamma_inventory_weight: 1.0
gamma_volatility_weight: 0.5
gamma_max_volatility_multiplier: 2.0
kappa: 10000.0
horizon_seconds: 30.0
# Full bid/ask spread floor = 0.04%, not 0.04% on each side.
min_spread: "0.0004"
adverse_selection_buffer: "0.0001"
max_spread: "0.02"
maker_fee: "0.0002"
taker_fee: "0.0005"
rebate_rate: "0.6"
volatility_samples: 200
warmup_samples: 20
refresh_seconds: 5.0
stale_seconds: 10.0
reconciliation_timeout: 15.0
cancel_timeout: 10.0
max_session_loss_quote: "1"
max_order_failures: 3
max_close_attempts: 3
flatten_on_stop: true
stop_timeout: 30.0
