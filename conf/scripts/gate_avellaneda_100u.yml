# Observation only. No orders, mode changes or leverage changes are submitted.
script_file_name: gate_avellaneda_portfolio.py
dry_run: true
candidate_limit: 20
candidate_pairs: []
sample_ticks: 60
account_refresh_seconds: 3
book_refresh_seconds: 10
monitor_seconds: 60
quote_refresh_seconds: 15
exit_timeout_seconds: 60
allow_market_exit: true
maker_fee_floor: '0.0002'
recovery:
  enabled: true # journal-owned exposure only; new/legacy unowned positions are refused
  confirm_snapshots: 2
  quiet_seconds: 5
  not_found_grace_seconds: 120
  max_pending_orders: 128
  max_fills_per_order: 10000
account_risk:
  enabled: true
  persist: true # mandatory for live account risk; dry-run has a separate file
  state_path: data/gate_avellaneda_risk_state.json
  session_loss_limit: '10'
  daily_loss_limit: '10'
  max_drawdown: '10'
  reconciliation_tolerance: '0.01'
  timezone: Asia/Taipei
deadman:
  enabled: true
  timeout_seconds: 30 # exchange cancels contract orders; does not flatten positions
  renew_seconds: 10
execution:
  retain_quotes: true
  max_quote_age_seconds: 60
  reprice_bps: '2'
  size_tolerance: '0.1'
quality_control:
  enabled: true # requires adaptive pricing and observed-fill telemetry
  mode: protect # observe collects evidence without changing execution
  min_orders: 30
  max_orders: 200
  window_seconds: 3600
  confidence_z: 2 # heuristic standard-error multiplier, not a calibrated guarantee
  max_penalty_bps: '20'
  uncertain_size_scale: '0.5'
  emergency_exit_probability: '0.1' # configured reserve assumption, not fitted probability
  exit_slippage_bps: '2'
  soft_exit_age_seconds: 120
telemetry:
  enabled: true
  path: logs/gate_avellaneda_quality.jsonl
  sample_seconds: 1
  markout_wait_seconds: 2
  max_bytes: 20000000
  backups: 5
micro:
  enabled: true
  mode: protect # observe logs without changing reference, sizes or retirement
  micro_weight: '0.25' # weighted-mid proxy, not a fitted Stoikov model
  max_age: 2
  warmup_seconds: 5
  min_samples: 20
  window_seconds: 5
  baseline_seconds: 120
  ema_seconds: 1
  confirm_seconds: 2
  recover_seconds: 5
  retire_seconds: 60
  match_grace_seconds: 0.5
  imbalance_threshold: '0.6'
  flow_threshold: '0.5'
  min_flow_quote: '25'
  depth_floor_ratio: '0.35'
  unmatched_loss_ratio: '0.5'
  caution_scale: '0.5'
  reprice_bps: '2'
  min_reprice_seconds: 2
gamma_control:
  enabled: true # per-pair risk aversion; fixed risk.gamma when false
  minimum: '0.5'
  maximum: '3'
  volatility_weight: '0.5'
  depth_weight: '0.5'
  micro_weight: '0.5'
  loss_weight: '1'
  ema_seconds: 15
  update_seconds: 3
  max_step_ratio: '0.1'
  reprice_bps: '2'
  min_reprice_seconds: 2
adaptive:
  enabled: true
  inventory_strength: '1' # inventory center adjustment, independent of quote width
  inventory_power: '2'
  soft_ratio: '0.5'
  reduce_only_ratio: '0.75'
  age_ramp_seconds: 120
  max_hold_seconds: 600
  same_side_fill_limit: 3 # distinct opening orders; partial fills count once
  same_side_cooldown_seconds: 15
  volatility_reference: '0.001'
  min_size_scale: '0.25'
  depth_target_multiple: '20'
  spread_multiplier: '1'
  unconfirmed_confidence: '0.5'
  micro_risk_bps: '2'
  carry_horizon_seconds: 120
  min_arrival_attenuation: '0.01' # relative sampled-volume decay, NOT fill probability
  max_gross_quote: '40' # worst-case positions plus pending opening orders
  max_directional_quote: '25'
  correlation_sample_seconds: 5
  correlation_history_samples: 121
  correlation_min_samples: 30
  max_abs_correlation: '0.85'
  require_correlation: true # second slot waits for enough fresh aligned returns
  stop_window_seconds: 900
  stop_count: 2
  stop_pause_seconds: 600
  recovery_seconds: 30
risk:
  capital: '100'
  reserve: '20'
  pair_margin: '40'
  max_position_quote: '20'
  order_quote: '5'
  pair_loss_limit: '5'
  leverage: 1
  gamma: '1' # adaptive baseline; also the fixed Gamma for legacy pricing
  eta: '1' # legacy opening size adjustment
  min_net_spread: '0.0002'
  max_book_spread: '0.005'
  max_quote_spread: '0.02'
  max_volatility: '0.005'
  max_trend: '0.03'
  max_funding: '0.002'
  min_volume: '1000000'
  min_depth: '50'
  max_age: 15
  failures_to_retire: 3
  cooldown: 600
kline_volatility:
  enabled: true # futures closed-candle calibration; requires adaptive + telemetry
  mode: observe # protect applies bounded opening-only widening; never changes 5U loss stop
  interval: 1m
  lookback_bars: 720
  min_returns: 120
  refresh_seconds: 60
  request_timeout_seconds: 5
  max_age_seconds: 180
  quote_horizon_seconds: 15
  tail_probability: '0.25' # normal terminal-price tail; NOT order fill probability
  smoothing_seconds: 300
  max_relative_change: '0.1'
  weight: '0.25'
  max_multiplier: '1.5'
  max_extra_bps: '5'
