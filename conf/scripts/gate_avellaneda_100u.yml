# Observation only. No orders, mode changes or leverage changes are submitted.
script_file_name: gate_avellaneda_portfolio.py
dry_run: true
candidate_limit: 20
candidate_pairs: []
sample_ticks: 60
account_refresh_seconds: 3
book_refresh_seconds: 10
monitor_seconds: 60
quote_refresh_seconds: 15
exit_timeout_seconds: 60
allow_market_exit: true
maker_fee_floor: '0.0002'
micro:
  enabled: true
  mode: protect # observe logs without changing reference, sizes or retirement
  micro_weight: '0.25' # weighted-mid proxy, not a fitted Stoikov model
  max_age: 2
  warmup_seconds: 5
  min_samples: 20
  window_seconds: 5
  baseline_seconds: 120
  ema_seconds: 1
  confirm_seconds: 2
  recover_seconds: 5
  retire_seconds: 60
  match_grace_seconds: 0.5
  imbalance_threshold: '0.6'
  flow_threshold: '0.5'
  min_flow_quote: '25'
  depth_floor_ratio: '0.35'
  unmatched_loss_ratio: '0.5'
  caution_scale: '0.5'
  reprice_bps: '2'
  min_reprice_seconds: 2
risk:
  capital: '100'
  reserve: '20'
  pair_margin: '40'
  max_position_quote: '20'
  order_quote: '5'
  pair_loss_limit: '5'
  leverage: 1
  gamma: '1'
  eta: '1'
  min_net_spread: '0.0002'
  max_book_spread: '0.005'
  max_quote_spread: '0.02'
  max_volatility: '0.005'
  max_trend: '0.03'
  max_funding: '0.002'
  min_volume: '1000000'
  min_depth: '50'
  max_age: 15
  failures_to_retire: 3
  cooldown: 600

